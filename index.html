<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVASTI - Predict. Optimize. Flow.</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BACKGROUND */
body {
    background: linear-gradient(135deg, #0a0f1a 0%, #1a0f2e 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: url('svasti logo.jpeg');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 300px;
    opacity: 0.12;
    z-index: 0;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 20px;
    position: relative;
    z-index: 1;
}

.header {
    text-align: center;
    background: rgba(20, 15, 35, 0.9);
    border-radius: 25px;
    padding: 30px;
    margin-bottom: 25px;
    border: 1px solid rgba(168, 85, 247, 0.5);
}

.logo-img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid #a855f7;
    margin-bottom: 15px;
}

/* TITLE */
h1 {
    font-size: 48px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    -webkit-background-clip: text;
    color: transparent;
}

.tagline {
    color: #c4b5fd;
    font-size: 18px;
}

/* CARDS */
.card {
    background: rgba(25, 20, 45, 0.85);
    border-radius: 24px;
    padding: 25px;
    margin-bottom: 25px;
    border: 1px solid rgba(168, 85, 247, 0.2);
}

.card h2 {
    color: #c084fc;
    border-left: 4px solid #a855f7;
    padding-left: 15px;
}

/* INPUTS */
input, select {
    background: #1e1b2e;
    border: 1px solid #4c1d95;
    padding: 12px;
    border-radius: 12px;
    color: white;
}

/* BUTTON */
button {
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    border: none;
    padding: 14px;
    border-radius: 14px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* AGENTS */
.agent {
    background: rgba(168, 85, 247, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 16px;
    padding: 15px;
}

/* STATS */
.stat-number {
    color: #c084fc;
}

/* RECOMMENDATION */
#recommendation {
    background: rgba(168, 85, 247, 0.15);
}

/* HELPLINE */
.helpline-card {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
}

/* CHART */
canvas {
    background: rgba(15, 10, 30, 0.6);
    border-radius: 16px;
}

</style>
</head>

<body>

<div class="container">
    <div class="header">
        <img src="svasti logo.jpeg" class="logo-img">
        <h1>🕉️ SVASTI 🚦</h1>
        <div class="tagline">Predict. Optimize. Flow.</div>
    </div>

    <div class="card">
        <h2>📝 Vehicle Registration</h2>
        <input placeholder="Name"><br><br>
        <input placeholder="Vehicle Number"><br><br>
        <button>Register</button>
    </div>

    <div class="card">
        <h2>📊 Traffic Graph</h2>
        <canvas id="trafficChart"></canvas>
    </div>

    <div class="card">
        <h2>🚦 Prediction</h2>
        <div id="recommendation">⏳ Waiting...</div>
    </div>
</div>

<script>
let ctx = document.getElementById('trafficChart').getContext('2d');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['6AM','8AM','10AM','12PM','2PM','4PM','6PM'],
        datasets: [{
            label: 'Traffic',
            data: [200,600,900,700,500,800,950],
            borderColor: '#a855f7',
            backgroundColor: 'rgba(168, 85, 247, 0.2)',
            fill: true
        }]
    }
});
</script>

</body>
</html>
