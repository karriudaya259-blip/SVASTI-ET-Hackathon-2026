<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVASTI - Smart Traffic System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
}

.navbar h2 {
    color: #38bdf8;
}

.navbar button {
    padding: 8px 15px;
    border-radius: 8px;
    border: none;
    background: #38bdf8;
    color: black;
    cursor: pointer;
}

/* HERO */
.hero {
    text-align: center;
    padding: 60px 20px;
}

.hero h1 {
    font-size: 2.5rem;
    color: #38bdf8;
}

.hero p {
    color: #94a3b8;
}

/* FORM */
.form-container {
    max-width: 600px;
    margin: auto;
    background: rgba(30, 41, 59, 0.6);
    padding: 25px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    background: #1e293b;
    color: white;
}

button.predict {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    border: none;
    border-radius: 10px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}

/* RESULT CARDS */
.results {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.card {
    width: 200px;
    padding: 20px;
    text-align: center;
    background: rgba(30, 41, 59, 0.6);
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h2 {
    color: #38bdf8;
}

/* MAP */
.map {
    margin: 30px auto;
    max-width: 800px;
}

iframe {
    width: 100%;
    height: 300px;
    border-radius: 12px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    color: #94a3b8;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>SVASTI 🚦</h2>
    <button>Login</button>
</div>

<!-- HERO -->
<div class="hero">
    <h1>Smart Traffic Prediction System</h1>
    <p>AI Powered Congestion & Route Optimization</p>
</div>

<!-- FORM -->
<div class="form-container">

    <input id="name" placeholder="Full Name">
    <input id="vehicle" placeholder="Vehicle Number">
    <input id="from" placeholder="From Location">
    <input id="to" placeholder="To Location">
    <input id="time" type="time">

    <select id="city">
        <option>Hyderabad</option>
        <option>Delhi</option>
        <option>Mumbai</option>
    </select>

    <button class="predict" onclick="predict()">🚀 Predict Traffic</button>

</div>

<!-- RESULTS -->
<div class="results">

    <div class="card">
        <h2 id="congestion">--</h2>
        <p>Congestion</p>
    </div>

    <div class="card">
        <h2 id="delay">--</h2>
        <p>Delay</p>
    </div>

    <div class="card">
        <h2 id="fuel">--</h2>
        <p>Fuel Efficiency</p>
    </div>

</div>

<!-- MAP -->
<div class="map">
    <iframe id="map" src="https://www.google.com/maps?q=Hyderabad&output=embed"></iframe>
</div>

<!-- FOOTER -->
<div class="footer">
    SVASTI | AI Traffic Intelligence 🚀
</div>

<script>

function predict() {

    let time = document.getElementById("time").value;
    let hour = parseInt(time.split(":")[0]);

    let congestion, delay, fuel;

    if (hour >= 8 && hour <= 10) {
        congestion = "85%";
        delay = "30 mins";
        fuel = "Low";
    } else {
        congestion = "25%";
        delay = "10 mins";
        fuel = "Good";
    }

    document.getElementById("congestion").innerText = congestion;
    document.getElementById("delay").innerText = delay;
    document.getElementById("fuel").innerText = fuel;

    // Map update
    let city = document.getElementById("city").value;
    document.getElementById("map").src =
        "https://www.google.com/maps?q=" + city + "&output=embed";
}

</script>

</body>
</html>
