<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVASTI - Predict. Optimize. Flow</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
}

/* Container */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* Title */
.title {
    text-align: center;
    margin-bottom: 20px;
    color: #38bdf8;
}

/* Card */
.card {
    background: rgba(30, 41, 59, 0.7);
    padding: 25px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

/* Form grid */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #1e293b;
    color: white;
}

/* Button */
button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #a855f7, #6366f1);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* SUCCESS BOX */
.success-box {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #065f46;
    color: #d1fae5;
    text-align: center;
    transition: 0.4s ease;
}

/* AFTER CLICK CHANGE */
.success-box.active {
    background: white;
    color: black;
    font-weight: 600;
    transform: scale(1.02);
}

/* Results */
.results {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.result-card {
    flex: 1;
    padding: 15px;
    text-align: center;
    background: #1e293b;
    border-radius: 10px;
}

.result-card h2 {
    color: #38bdf8;
}

/* Map */
.map {
    margin-top: 20px;
}

iframe {
    width: 100%;
    height: 300px;
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">🚦 SVASTI - Smart Traffic System</h1>

    <div class="card">

        <h2>📝 Vehicle Registration</h2>

        <div class="form-grid">
            <input id="name" placeholder="Full Name">
            <input id="phone" placeholder="Phone Number">
            <input id="aadhaar" placeholder="Aadhaar Number">
            <input id="vehicle" placeholder="Vehicle Number">
            <input id="type" placeholder="Vehicle Type">
            <input id="seats" placeholder="Seats">
            <input id="city" placeholder="City">
            <input id="from" placeholder="From Location">
            <input id="to" placeholder="To Location">
            <input id="date" type="date">
            <input id="time" type="time">
            <input id="carpool" placeholder="Carpool Option">
        </div>

        <button onclick="predict()">Register & Predict</button>

        <!-- SUCCESS MESSAGE -->
        <div id="successBox" class="success-box">
            ✔ Registration Successful! Safe travels!
        </div>

    </div>

    <!-- RESULTS -->
    <div class="results">
        <div class="result-card">
            <h2 id="congestion">--</h2>
            <p>Congestion</p>
        </div>
        <div class="result-card">
            <h2 id="delay">--</h2>
            <p>Delay</p>
        </div>
        <div class="result-card">
            <h2 id="fuel">--</h2>
            <p>Fuel</p>
        </div>
    </div>

    <!-- MAP -->
    <div class="map">
        <iframe id="map" src="https://www.google.com/maps?q=Delhi&output=embed"></iframe>
    </div>

</div>

<script>

function predict() {

    // 🔥 SUCCESS BOX CHANGE
    let successBox = document.getElementById("successBox");
    successBox.innerText = "✅ You are registered successfully!";
    successBox.classList.add("active");

    // Prediction logic
    let time = document.getElementById("time").value;
    let hour = parseInt(time.split(":")[0]);

    let congestion, delay, fuel;

    if (hour >= 8 && hour <= 10) {
        congestion = "85%";
        delay = "30 mins";
        fuel = "Low";
    } else {
        congestion = "25%";
        delay = "10 mins";
        fuel = "Good";
    }

    document.getElementById("congestion").innerText = congestion;
    document.getElementById("delay").innerText = delay;
    document.getElementById("fuel").innerText = fuel;

    // Map update
    let city = document.getElementById("city").value;
    if(city){
        document.getElementById("map").src =
            "https://www.google.com/maps?q=" + city + "&output=embed";
    }
}

</script>

</body>
</html>
